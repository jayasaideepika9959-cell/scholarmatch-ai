services:
  - type: web
    name: scholarmatch-ai
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: API_BASE_URL
        value: https://scholarmatch-ai.onrender.com
      - key: FRONTEND_URL
        value: https://scholarmatch-ai.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://scholarmatch-ai.onrender.com,http://localhost:5000,http://localhost:3000,http://127.0.0.1:5000,http://127.0.0.1:3000
